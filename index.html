<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍콩본색이 다녀온 영화촬영지</title>
    <style>
        /* UI 깨짐 방지를 위해 box-sizing을 border-box로 설정 */
        * {
            box-sizing: border-box;
        }
        /* 기본 스타일 및 헤더 (PC 기준) */
        body {
            font-family: 'Arial Black', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background-color: #CC0000;
            color: #FFFFFF;
            padding: 60px 20px 40px 20px; /* 상단 패딩을 늘려 링크 공간 확보 */
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        h1 { margin: 0; font-size: 3.5em; letter-spacing: 2px; text-transform: uppercase; }
        h2 { margin-top: 10px; font-size: 1.5em; font-weight: normal; }

        /* 지도와 목록 컨테이너 (PC 기준 - 가로 배치) */
        .map-container {
            display: flex;
            flex-direction: row; /* 기본 가로 배치 */
            width: 95%;
            max-width: 1400px;
            height: 75vh; /* 화면 높이에 맞춰 조정 */
            min-height: 600px;
            margin: 40px 0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border: 5px solid #CC0000;
        }
        #map { flex-basis: 70%; height: 100%; }
        #list-panel {
            flex-basis: 30%;
            background-color: #f5f5f5;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
        }

        /* 목록 패널 내부 스타일 */
        #list-panel h3 { color: #CC0000; margin-top: 0; padding-bottom: 5px; border-bottom: 2px solid #ccc; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-weight: bold; }
        /* 범례 아이콘에 테두리를 추가하여 시인성 향상 (노란색은 특히 중요) */
        .legend-icon { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; border: 1px solid #666; }
        .location-item { padding: 8px 5px; cursor: pointer; border-bottom: 1px dashed #cccccc; }
        .location-item:hover { background-color: #e0e0e0; }
        .location-item:last-child { border-bottom: none; }

        /* 상단 우측 컨테이너 (언어 선택 + 유튜브 링크 그룹화) */
        #top-right-container {
            position: absolute;
            top: 15px;
            right: 20px;
            text-align: right;
        }

        /* 언어 선택 버튼 스타일 */
        #language-selector {
            display: flex;
            gap: 5px;
            justify-content: flex-end; /* 버튼들을 우측 정렬 */
            margin-bottom: 8px; /* 링크와의 간격 */
        }
        #language-selector button {
            background-color: #FFFFFF;
            color: #CC0000;
            border: 1px solid #CC0000;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
        }
        #language-selector button.active,
        #language-selector button:hover {
            background-color: #CC0000;
            color: #FFFFFF;
        }

        /* 유튜브 링크 스타일 */
        #youtube-link {
            color: #FFFFFF;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 8px;
            /* 가독성을 위해 배경 추가 */
            background-color: rgba(0,0,0,0.3);
            border-radius: 3px;
            transition: background-color 0.3s;
            display: inline-block;
        }
        #youtube-link:hover {
            background-color: rgba(0,0,0,0.6);
            text-decoration: underline;
        }


        /* 푸터 */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            background-color: #CC0000;
            color: #FFFFFF;
            font-size: 0.9em;
            margin-top: auto;
        }

        /* ===================================== */
        /* 모바일 반응형 UI (Mobile Responsive UI) */
        /* ===================================== */
        @media (max-width: 768px) {
            header {
                padding: 80px 15px 30px 15px; /* 상단 패딩 증가하여 링크 공간 확보, 좌우 패딩 축소 */
            }

            h1 {
                font-size: 2.2em; /* 타이틀 폰트 크기 축소 */
            }

            h2 {
                font-size: 1.1em; /* 서브타이틀 폰트 크기 축소 */
            }

            /* 상단 우측 컨테이너 위치 조정 */
            #top-right-container {
                top: 10px;
                right: 10px;
            }

            #language-selector button {
                padding: 4px 8px;
                font-size: 11px;
            }

            #youtube-link {
                font-size: 11px;
                padding: 4px 6px;
            }

            /* 지도 컨테이너 레이아웃 변경 (가로 -> 세로) */
            .map-container {
                flex-direction: column; /* 핵심 변경: 세로 배치 */
                height: auto; /* 높이 자동 조절 */
                min-height: unset;
                margin: 20px 0;
                width: 95%; /* 좌우 여백 유지 */
            }

            /* 지도 영역 설정 */
            #map {
                flex-basis: auto; /* PC 설정 초기화 */
                width: 100%;
                height: 50vh; /* 모바일 화면 높이의 50% 사용 */
            }

            /* 목록 패널 영역 설정 */
            #list-panel {
                flex-basis: auto; /* PC 설정 초기화 */
                width: 100%;
                /* 목록 패널의 최대 높이를 설정하여 스크롤 가능하게 함 */
                max-height: 60vh; 
                overflow-y: auto;
            }
        }

    </style>
</head>
<body>
    <header>
        <div id="top-right-container">
            <div id="language-selector">
                <button data-lang="ko" class="active" onclick="switchLanguage('ko', this)">한국어</button>
                <button data-lang="jp" onclick="switchLanguage('jp', this)">日本語</button>
                <button data-lang="en" onclick="switchLanguage('en', this)">English</button>
                <button data-lang="zh-hk" onclick="switchLanguage('zh-hk', this)">廣東話</button>
            </div>
            <div id="youtube-link-container">
                <a href="https://www.youtube.com/channel/UCMLv4l3L2VDpJdRvq6zTbcw" target="_blank" id="youtube-link">홍콩본색 유튜브 채널 바로가기</a>
            </div>
        </div>
        <h1 id="header-title">홍콩본색이 다녀온 영화촬영지</h1>
        <h2 id="header-subtitle">총 100개 홍콩 영화 속 필름 로케 후보지</h2>
    </header>

    <div class="map-container">
        <div id="map"></div>
        <div id="list-panel">
            <h3 id="legend-title">영화 촬영지 목록</h3>
            <div id="legend">
                </div>

            <h3 id="list-header" style="margin-top: 20px;">로케이션 목록 (총 100개)</h3>
            <div id="location-list">
                </div>
        </div>
    </div>

    <footer>
        <p id="footer-text">© 2025 홍콩본색. All Rights Reserved.</p>
    </footer>

    <div id="map-script-container"></div>

    <script>
        let map;
        let infoWindow;
        let service;
        let currentMarker = null;
        let activeMarkers = [];
        let currentLang = 'ko';
        const API_KEY = "AIzaSyA8iM2FvVwK37oTKyDpmoPTuPylBErGRlU"; // Google Maps API Key
        const TOTAL_LOCATIONS = 100; // 총 로케이션 수 (100개로 증가)

        // ----------------------------------------------------
        // 1. 다국어 텍스트 데이터
        // ----------------------------------------------------
        const translations = {
            'ko': {
                title: "홍콩본색이 다녀온 영화촬영지", subtitle: `총 ${TOTAL_LOCATIONS}개 홍콩 영화 속 필름 로케 후보지`, legend: "영화 촬영지 목록", list_header: `로케이션 목록 (총 ${TOTAL_LOCATIONS}개)`, footer: "© 2025 홍콩본색. All Rights Reserved.",
                find_place: "찾아낸 장소: ", no_place: "여긴 등록된 장소가 없네!", details: "Google 지도에서 길찾기",
                youtube_link: "홍콩본색 유튜브 채널 바로가기",
                youtube_title: "관련 영상 보기",
                categories: {
                    'ABT1': '영웅본색 1', 'CHUNGKING': '중경삼림 & 타락천사',
                    'THIEVES': '도둑들', 'ABT2': '영웅본색 2', 'COMRADES': '첨밀밀',
                    'JOJO': '죠죠의 기묘한 모험'
                },
                mapLangCode: 'ko'
            },
            'jp': {
                title: "香港本色が訪れた映画ロケ地", subtitle: `全${TOTAL_LOCATIONS}か所の香港映画ロケ候補地`, legend: "映画撮影地リスト", list_header: `ロケーション一覧 (全${TOTAL_LOCATIONS}か所)`, footer: "© 2025 香港本色. All Rights Reserved.",
                find_place: "見つけた場所: ", no_place: "ここは登録されていません！", details: "Googleマップでルート検索",
                youtube_link: "香港本色 YouTube チャンネルへ",
                youtube_title: "関連動画を見る",
                categories: {
                    'ABT1': '男たちの挽歌', 'CHUNGKING': '恋する惑星 & 天使の涙',
                    'THIEVES': '泥棒たち', 'ABT2': '男たちの挽歌 2', 'COMRADES': 'ラブソング',
                    'JOJO': 'ジョジョの奇妙な冒険'
                },
                mapLangCode: 'ja'
            },
            'en': {
                title: "Hongkong Noir Film Locations", subtitle: `${TOTAL_LOCATIONS} Hong Kong Film Location Candidates`, legend: "Film Location List", list_header: `Location List (Total ${TOTAL_LOCATIONS})`, footer: "© 2025 Hongkong Bonsak. All Rights Reserved.",
                find_place: "Found Place: ", no_place: "No registered place here!", details: "Get Directions on Google Maps",
                youtube_link: "Go to Hongkong Bonsaek YouTube",
                youtube_title: "Watch Related Video",
                categories: {
                    'ABT1': 'A Better Tomorrow', 'CHUNGKING': 'Chungking & Fallen Angels',
                    'THIEVES': 'The Thieves', 'ABT2': 'A Better Tomorrow 2', 'COMRADES': 'Comrades, Almost a Love Story',
                    'JOJO': 'Jojo\'s Bizarre Adventure'
                },
                mapLangCode: 'en'
            },
            'zh-hk': {
                title: "香港本色到訪的電影取景地", subtitle: `共${TOTAL_LOCATIONS}個香港電影取景地候選地點`, legend: "電影取景地清單", list_header: `地點列表 (共${TOTAL_LOCATIONS}個)`, footer: "© 2025 香港本色 版權所有",
                find_place: "找到的地點: ", no_place: "這裡沒有註冊地點！", details: "在 Google 地圖上規劃路線",
                youtube_link: "前往香港本色 YouTube 頻道",
                youtube_title: "觀看相關影片",
                categories: {
                    'ABT1': '英雄本色', 'CHUNGKING': '重慶森林 & 墮落天使',
                    'THIEVES': '盜賊門', 'ABT2': '英雄本色 2', 'COMRADES': '甜蜜蜜',
                    'JOJO': 'JoJo的奇妙冒險'
                },
                mapLangCode: 'zh-HK'
            }
        };

        // ----------------------------------------------------
        // 2. 지도 API 스크립트를 로드하는 함수
        // ----------------------------------------------------
        function loadMapScript(langCode) {
            const scriptContainer = document.getElementById('map-script-container');
            // 언어 변경 시 맵을 새로 로드하기 위해 기존 스크립트 정리
            scriptContainer.innerHTML = '';
             if (window.google && window.google.maps) {
                 // Forcefully remove the script if it exists to ensure language change
                 document.querySelectorAll('script[src*="maps.googleapis.com"]').forEach(s => s.remove());
                 delete window.google.maps;
            }

            const script = document.createElement('script');
            script.async = true;
            script.defer = true;

            script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places&language=${langCode}&callback=initMap`;

            document.head.appendChild(script);
        }

        // ----------------------------------------------------
        // 3. 주요 로직 함수 및 데이터 (색상 지정)
        // ----------------------------------------------------
        const CATEGORIES = {
            'ABT1': { color: '#000000' },      // 영웅본색1 (검정)
            'CHUNGKING': { color: '#CC0000' }, // 중경삼림 & 타락천사 (빨강)
            'THIEVES': { color: '#8B4513' },   // 도둑들 (갈색)
            'ABT2': { color: '#A9A9A9' },      // 영웅본색2 (회색 - DarkGray)
            'COMRADES': { color: '#1E90FF' },  // 첨밀밀 (파랑 - DodgerBlue)
            'JOJO': { color: '#FFD700' }       // 죠죠의 기묘한 모험 (노란색 - Gold)
        };

        window.initMap = function() {
            const HONG_KONG_BOUNDS = { north: 22.56, south: 22.15, west: 113.80, east: 114.50 };

            if (!document.getElementById("map")) return;

            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 22.3027, lng: 114.1712 }, // 침사추이 중심
                zoom: 13,
                minZoom: 11,
                maxZoom: 19,
                restriction: { latLngBounds: HONG_KONG_BOUNDS, strictBounds: false },
                mapTypeControl: false, fullscreenControl: true, streetViewControl: true, zoomControl: true,
                gestureHandling: 'greedy',
                styles: [
                    // POI(관심 지점) 라벨을 단순화하여 지도 가독성 향상
                    { featureType: "poi.business", elementType: "labels", stylers: [{ visibility: "off" }] },
                    { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
                    { featureType: "transit", elementType: "labels.icon", stylers: [{ visibility: "simplified" }] }
                ]
            });

            service = new google.maps.places.PlacesService(map);
            // InfoWindow 최대 너비 설정 (유튜브 영상 크기 고려)
            infoWindow = new google.maps.InfoWindow({
                maxWidth: 320
            });

            activeMarkers = addExportedMarkers();

            populateListPanel(activeMarkers);

            // 지도 클릭 이벤트 (참고용 위치 확인)
            map.addListener("click", (mapsMouseEvent) => {
                const latLng = mapsMouseEvent.latLng;

                if (currentMarker) {
                    currentMarker.setMap(null);
                }
                infoWindow.close();

                // 클릭한 위치에 임시 마커 표시
                currentMarker = new google.maps.Marker({
                    position: latLng,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        fillColor: '#FFD700', // Bright Yellow
                        fillOpacity: 0.8,
                        strokeColor: '#CC0000', // Red border
                        strokeWeight: 2,
                        scale: 10,
                    },
                    zIndex: 9999 // 항상 위에 표시
                });

                getPlaceDetails(latLng);
            });
        }

        // 초기 맵 로드 스크립트 호출 (기본 언어 'ko')
        document.addEventListener('DOMContentLoaded', () => {
            loadMapScript(translations[currentLang].mapLangCode);
        });

        // 언어 변경 함수
        function switchLanguage(lang, element) {
            if (currentLang === lang) return;
            currentLang = lang;
            const langCode = translations[lang].mapLangCode;

            document.querySelectorAll('#language-selector button').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // 텍스트 업데이트
            document.getElementById('header-title').innerText = translations[lang].title;
            document.getElementById('header-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('legend-title').innerText = translations[lang].legend;
            document.getElementById('list-header').innerText = translations[lang].list_header;
            document.getElementById('footer-text').innerText = translations[lang].footer;
            document.getElementById('youtube-link').innerText = translations[lang].youtube_link;

            // 맵 스크립트 다시 로드 (언어 변경 적용)
            loadMapScript(langCode);
        }

        function getMarkerIcon(category) {
            const config = CATEGORIES[category] || CATEGORIES['CHUNGKING']; // 기본값 설정
            
            // 노란색 마커는 테두리를 검정색으로 하여 시인성 확보
            const strokeColor = (category === 'JOJO') ? '#000000' : '#FFFFFF';

            return {
                path: google.maps.SymbolPath.CIRCLE,
                fillColor: config.color,
                fillOpacity: 1,
                strokeColor: strokeColor,
                strokeWeight: 1.5,
                scale: 8,
            };
        }

        // 지도 클릭 시 주변 장소 정보 가져오기 (참고용 기능)
        function getPlaceDetails(latLng) {
            const request = { location: latLng, radius: 50 };
            service.nearbySearch(request, (results, status) => {
                let contentString = "";
                const translation = translations[currentLang];

                if (status === google.maps.places.PlacesServiceStatus.OK && results.length > 0) {
                    const place = results[0];
                    // 임시 마커 클릭 시에는 장소 보기 링크 제공
                    const detailsLink = `<a href="https://www.google.com/maps/search/?api=1&query=${latLng.lat()},${latLng.lng()}&query_place_id=${place.place_id}" target="_blank">View on Google Maps</a>`;

                    contentString = `
                        <div style="font-family: Arial, sans-serif; padding: 5px;">
                            <strong>${translation.find_place}</strong><br>
                            <h4 style="margin: 5px 0;">${place.name}</h4>
                            <p style="font-size: 12px;">${place.vicinity || "N/A"}</p>
                            ${detailsLink}
                        </div>
                    `;
                } else {
                    contentString = `
                        <div style="font-family: Arial, sans-serif; padding: 5px;">
                            <strong>${translation.no_place}</strong><br>
                            <p style="font-size: 12px;">Lat: ${latLng.lat().toFixed(5)}, Lng: ${latLng.lng().toFixed(5)}</p>
                        </div>
                    `;
                }
                infoWindow.setContent(contentString);
                infoWindow.open(map, currentMarker);
            });
        }

        // 제공된 데이터를 기반으로 마커를 추가하는 함수
        function addExportedMarkers() {
            const exportedLocations = [
                // [중경삼림 & 타락천사] (CHUNGKING) - 44개
                { title: "ESSO LAM TEI 埃索 藍地油站", lat: 22.42345586569671, lng: 113.98332595829308, category: 'CHUNGKING', youtube_id: 'uG0R07ReTvg', start_time: 2811, description: { ko: "타락천사 추가엔딩 주유소", jp: "『天使の涙』追加エンディングのガソリンスタンド", en: "Gas station from the alternate ending of 'Fallen Angels'", 'zh-hk': "《墮落天使》追加結局油站" }},
                { title: "United Centre 統一中心", lat: 22.278609903076784, lng: 114.16593268413227, category: 'CHUNGKING', youtube_id: 'uG0R07ReTvg', start_time: 2811, description: { ko: "타락천사 추가 엔딩씬", jp: "『天使の涙』追加エンディングシーン", en: "Alternate ending scene of 'Fallen Angels'", 'zh-hk': "《墮落天使》追加結局場景" }},

                 // [죠죠의 기묘한 모험] (JOJO) - 1개
                { title: "Haw Par Mansion 虎豹別墅", lat: 22.275613260428443, lng: 114.19535537302593, category: 'JOJO', youtube_id: 'kGZAdbooOKo', start_time: 0, description: { ko: "폴나레프와 압둘이 싸운 곳", jp: "ポルナレフとアヴドゥルが戦った場所", en: "Where Polnareff and Avdol fought", 'zh-hk': "波魯那雷夫和阿布德爾戰鬥的地方" }}

            const markers = [];
            exportedLocations.forEach(loc => {
                const marker = new google.maps.Marker({
                    position: { lat: loc.lat, lng: loc.lng },
                    map: map,
                    title: loc.title,
                    icon: getMarkerIcon(loc.category)
                });

                marker.addListener("click", () => {
                    // 임시 마커가 있다면 제거
                    if (currentMarker) {
                        currentMarker.setMap(null);
                        currentMarker = null;
                    }

                    infoWindow.close();
                    const translation = translations[currentLang];
                    const categoryName = translation.categories[loc.category];

                    // 현재 언어에 맞는 설명 가져오기 (없으면 한국어)
                    const currentDescription = loc.description[currentLang] || loc.description['ko'];

                    // 상세 설명
                    const locationDescription = currentDescription ? `<p style="margin-top: 8px; font-size: 14px; font-weight: normal; color: #333;">${currentDescription}</p>` : '';

                    // 길찾기 링크
                    const directionsLink = `<p style="margin-top: 10px; font-size: 12px;"><a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank">${translation.details}</a></p>`;

                    // 유튜브 영상 삽입 로직 (데이터가 있는 경우에만)
                    let youtubeEmbed = '';
                    if (loc.youtube_id) {
                        const videoId = loc.youtube_id;
                        const startTime = loc.start_time || 0; // 시작 시간이 없으면 0초
                        // YouTube URL에 ?start=시간(초) 파라미터를 추가하여 시작 시간 지정
                        youtubeEmbed = `
                            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                                <h4 style="margin: 0 0 8px 0; color: #CC0000;">${translation.youtube_title}</h4>
                                <iframe width="280" height="157"
                                    src="https://www.youtube.com/embed/${videoId}?start=${startTime}"
                                    frameborder="0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen>
                                </iframe>
                            </div>
                        `;
                    }

                    infoWindow.setContent(`
                        <div style="font-family: Arial, sans-serif; padding: 5px;">
                            <h4 style="margin: 0 0 5px 0; color: #CC0000;">[${categoryName}]</h4>
                            <h3 style="margin: 0;">${loc.title}</h3>
                            ${locationDescription}
                            ${youtubeEmbed}
                            ${directionsLink}
                        </div>
                    `);
                    infoWindow.open(map, marker);
                    map.panTo(marker.getPosition());
                });

                markers.push({ data: loc, marker: marker });
            });

            return markers;
        }

        // 리스트 패널을 채우는 함수
        function populateListPanel(markers) {
            const listPanel = document.getElementById('location-list');
            const legendDiv = document.getElementById('legend');
            const translation = translations[currentLang];
            listPanel.innerHTML = '';
            legendDiv.innerHTML = '';

            // 1. 범례 (Legend) 추가
            // 표시 순서 지정
            const categoriesToDisplay = ['CHUNGKING', 'ABT1', 'THIEVES', 'ABT2', 'COMRADES', 'JOJO'];
            categoriesToDisplay.forEach(key => {
                const config = CATEGORIES[key];
                const legendItem = document.createElement('div');
                legendItem.className = 'legend-item';

                const iconColor = config.color;

                legendItem.innerHTML = `
                    <div class="legend-icon" style="background-color: ${iconColor};"></div>
                    <span>${translation.categories[key]}</span>
                `;
                legendDiv.appendChild(legendItem);
            });

            // 2. 장소 목록 (List) 추가 (카테고리별, 제목순 정렬)
            const sortedMarkers = markers.sort((a, b) =>
                a.data.category.localeCompare(b.data.category) ||
                a.data.title.localeCompare(b.data.title)
            );

            sortedMarkers.forEach(item => {
                const loc = item.data;
                const listItem = document.createElement('div');
                listItem.className = 'location-item';

                const iconColor = CATEGORIES[loc.category].color;
                const categoryName = translation.categories[loc.category];

                // 현재 언어에 맞는 설명 가져오기 (없으면 한국어)
                const currentDescription = loc.description[currentLang] || loc.description['ko'];

                // 목록 아이콘 (노란색은 테두리 강조)
                const borderColor = (loc.category === 'JOJO') ? '#999' : '#666';
                const iconHtml = `<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background-color:${iconColor}; margin-right:8px; vertical-align: top; margin-top: 4px; border: 1px solid ${borderColor};"></span>`;

                // 목록 텍스트 (제목과 카테고리/설명) - UI 개선을 위해 Flexbox 사용
                listItem.innerHTML = `
                    <div style="display: flex;">
                        ${iconHtml}
                        <div style="flex: 1;">
                            <strong>${loc.title}</strong>
                            <br>
                            <span style="color:#777; font-size:12px;">(${categoryName}) - ${currentDescription}</span>
                        </div>
                    </div>
                `;

                // 목록 클릭 이벤트
                listItem.onclick = () => {
                    // 모바일 환경에서는 줌 레벨을 조금 더 가깝게 설정
                    const zoomLevel = window.innerWidth <= 768 ? 17 : 16;
                    map.setZoom(zoomLevel); 
                    google.maps.event.trigger(item.marker, 'click');
                };

                listPanel.appendChild(listItem);
            });
        }
    </script>
